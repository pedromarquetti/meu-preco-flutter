name: meu_preco_frontend
description: "Front end do aplicativo Meu Preço, que permite aos usuários pesquisar e comparar preços de produtos em diferentes lojas."
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^18.1.0
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.4.2
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/main_icon.png

# Platform launcher icons generated from the Meu Preço brand icon.
# Regenerate with `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/main_icon.png
  adaptive_icon_background: "#00C853"
  adaptive_icon_foreground: assets/main_icon.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/main_icon.png
    background_color: "#00C853"
    theme_color: "#0091EA"
  macos:
    generate: true
    image_path: assets/main_icon.png
  windows:
    generate: true
    image_path: assets/main_icon.png
    icon_size: 256
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

