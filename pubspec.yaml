name: meu_preco_frontend
description: "Front end do aplicativo Meu Preço, que permite aos usuários pesquisar e comparar preços de produtos em diferentes lojas."
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^18.1.0
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true

