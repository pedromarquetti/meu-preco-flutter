<!doctype html>
<html lang="pt-BR">
	<head>
		<base href="$FLUTTER_BASE_HREF" />

		<meta charset="UTF-8" />
		<meta content="IE=Edge" http-equiv="X-UA-Compatible" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!--
		  GitHub Pages cannot set response headers, so the public shell carries a
		  CSP meta policy.

		  This is the development/local baseline used by `flutter run` and by a
		  plain `flutter build web` served from localhost or the LAN:
		  - Flutter's debug loader (DDC) injects inline scripts and uses eval.
		  - The debug service connects over a WebSocket on localhost.
		  - Local testing may talk to HTTP APIs on localhost or the LAN.
		  - The mobile_scanner Web backend loads its reviewed zxing-wasm helper
		    from jsDelivr and fetches the WASM binary from the same origin.

		  scripts/build_web_pages.sh replaces this policy with the stricter
		  production policy (no eval, no broad HTTP/WebSocket sources) before
		  the bundle is published. The production policy is what GitHub Pages
		  serves. This is defense-in-depth and does not make browser-held bearer
		  tokens XSS-proof.
		-->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: http: ws: wss:; media-src 'self' blob:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';"
		/>

		<meta
			name="description"
			content="Meu Preço — compare preços de produtos entre supermercados."
		/>

		<!-- iOS meta tags & icons -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<meta name="apple-mobile-web-app-title" content="Meu Preço" />
		<link rel="apple-touch-icon" href="icons/Icon-192.png" />

		<!-- Favicon -->
		<link rel="icon" type="image/png" href="favicon.png" />

		<title>Meu Preço</title>
		<link rel="manifest" href="manifest.json" />
	</head>
	<body>
		<script src="flutter_bootstrap.js" async></script>
	</body>
</html>
