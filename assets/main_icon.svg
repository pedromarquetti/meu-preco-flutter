<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Modern Green to Blue -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C853" />
      <stop offset="100%" stop-color="#0091EA" />
    </linearGradient>
    
    <!-- Cart & Element Gradient -->
    <linearGradient id="cartGradient" x1="0%" y1="0%" x2="0%" y2="

http://googleusercontent.com/image_generation_content/0_982

100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F7FA" />
    </linearGradient>
    
    <!-- Soft Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Icon Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)" />

  <!-- Shopping Cart Icon Group -->
  <g transform="translate(136, 110)" filter="url(#dropShadow)">
    <!-- Cart Body Path -->
    <path d="M 32 40 L 64 40 L 96 160 L 208 160 L 232 80 L 80 80" fill="none" stroke="url(#cartGradient)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Cart Wheels -->
    <circle cx="104" cy="200" r="16" fill="url(#cartGradient)" />
    <circle cx="192" cy="200" r="16" fill="url(#cartGradient)" />
    
    <!-- Dollar Sign inside Cart -->
    <text x="150" y="140" font-family="Arial, sans-serif" font-weight="bold" font-size="46" fill="#FFFFFF" text-anchor="middle">$</text>
  </g>

  <!-- App Title / Branding Text -->
  <text x="256" y="420" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="42" fill="#FFFFFF" text-anchor="middle" filter="url(#dropShadow)">Meu Preço</text>
</svg>
