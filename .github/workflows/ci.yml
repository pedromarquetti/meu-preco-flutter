name: CI

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
  workflow_call:
    outputs:
      web-artifact-name:
        description: Name of the validated Web bundle artifact.
        value: ${{ jobs.build-and-test.outputs.web-artifact-name }}
      web-artifact-path:
        description: Path of the Web bundle inside the artifact.
        value: ${{ jobs.build-and-test.outputs.web-artifact-path }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      web-artifact-name: web-build-${{ github.run_id }}
      web-artifact-path: build/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Flutter toolchain
        uses: ./.github/actions/setup-flutter

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug
        run: flutter build apk --debug

      - name: Build Web
        run: scripts/build_web_pages.sh

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.run_id }}
          path: build/web
          if-no-files-found: error
          retention-days: 7
