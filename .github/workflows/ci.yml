name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      API_ORIGIN: ${{ vars.API_ORIGIN || 'http://localhost:8080' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug
        run: flutter build apk --debug --dart-define=API_ORIGIN=${{ env.API_ORIGIN }}

      - name: Build Web
        run: flutter build web --dart-define=API_ORIGIN=${{ env.API_ORIGIN }}

      - name: Upload Web build artifact
        if: always() # Run even if previous steps fail
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.run_id }}
          path: build/web
          if-no-files-found: ignore
          retention-days: 7
