name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Non-secret test origin used only to validate build-time configuration.
  API_ORIGIN: http://localhost:8080

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Flutter toolchain
        uses: ./.github/actions/setup-flutter

      - name: Validate API origin
        run: |
          if [ -z "${API_ORIGIN:-}" ]; then
            echo "API_ORIGIN must be set and non-empty." >&2
            exit 1
          fi

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug
        run: flutter build apk --debug --dart-define=API_ORIGIN="$API_ORIGIN"

      - name: Build Web
        run: flutter build web --dart-define=API_ORIGIN="$API_ORIGIN"

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.run_id }}
          path: build/web
          if-no-files-found: error
          retention-days: 7
