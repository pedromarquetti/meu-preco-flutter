name: Pages

# Publishes the Flutter Web bundle only for immutable version tags, and only
# after the reusable CI workflow succeeds for that exact tag commit. GitHub
# Actions cannot express `needs` across two independently triggered workflows,
# so validation is called synchronously from this same workflow.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Same tag/version rule as release.yml, through the shared script, so a tag
  # cannot publish a GitHub Release while being rejected by Pages (or vice
  # versa).
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag against pubspec version
        run: scripts/verify_release_tag.sh "$GITHUB_REF_NAME"

  validate:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    runs-on: ubuntu-latest
    env:
      # Repository variable override for custom domains, which serve the site
      # at the domain root (`BASE_HREF=/`). Without it the build uses the
      # github.io sub-path derived from the repository name. The build and both
      # verification scripts must agree on this value.
      BASE_HREF: ${{ vars.BASE_HREF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Flutter toolchain
        uses: ./.github/actions/setup-flutter

      - name: Build Pages bundle
        run: scripts/build_web_pages.sh

      - name: Validate Pages bundle
        run: |
          scripts/verify_web_bundle.sh build/web "$BASE_HREF"
          scripts/verify_web_routing.sh build/web "$BASE_HREF"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke-test deployed Pages shell
        env:
          # Repository variable override for custom domains. `page_url` is
          # reported as HTTP until GitHub enforces HTTPS, so the script also
          # upgrades to HTTPS itself when that origin answers.
          DEPLOYMENT_URL: ${{ vars.DEPLOYMENT_URL || needs.deploy.outputs.page_url }}
          # Empty by default: the script derives the expected base path from
          # the deployed URL, so a custom domain at the root expects `/`.
          BASE_HREF: ${{ vars.BASE_HREF }}
        run: scripts/verify_pages_deployment.sh "$DEPLOYMENT_URL" "$BASE_HREF"
