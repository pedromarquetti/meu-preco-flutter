name: Build

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  API_ORIGIN: ${{ vars.API_ORIGIN || 'http://localhost:8080' }}

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Flutter toolchain
        uses: ./.github/actions/setup-flutter

      - name: Validate API origin
        run: |
          if [ -z "${API_ORIGIN:-}" ]; then
            echo "API_ORIGIN must be set and non-empty." >&2
            exit 1
          fi

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug
        run: flutter build apk --debug --dart-define=API_ORIGIN="$API_ORIGIN"

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-${{ github.run_id }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Flutter toolchain
        uses: ./.github/actions/setup-flutter

      - name: Validate API origin
        run: |
          if [ -z "${API_ORIGIN:-}" ]; then
            echo "API_ORIGIN must be set and non-empty." >&2
            exit 1
          fi

      - name: Build Web
        run: flutter build web --dart-define=API_ORIGIN="$API_ORIGIN"

      - name: Upload Web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ github.run_id }}
          path: build/web
          if-no-files-found: error
          retention-days: 7

  ios-unsigned:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Flutter toolchain
        uses: ./.github/actions/setup-flutter

      - name: Validate API origin
        run: |
          if [ -z "${API_ORIGIN:-}" ]; then
            echo "API_ORIGIN must be set and non-empty." >&2
            exit 1
          fi

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build iOS unsigned
        run: flutter build ios --release --no-codesign --dart-define=API_ORIGIN="$API_ORIGIN"
