name: Build

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-debug:
    runs-on: ubuntu-latest
    env:
      API_ORIGIN: ${{ vars.API_ORIGIN || 'http://localhost:8080' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze and test
        run: |
          dart format --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Build Android debug
        run: flutter build apk --debug --dart-define=API_ORIGIN=${{ env.API_ORIGIN }}

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-${{ github.run_id }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    env:
      API_ORIGIN: ${{ vars.API_ORIGIN || 'http://localhost:8080' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Web
        run: flutter build web --dart-define=API_ORIGIN=${{ env.API_ORIGIN }}

      - name: Upload Web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ github.run_id }}
          path: build/web
          if-no-files-found: error
          retention-days: 7

  ios-unsigned:
    runs-on: macos-latest
    if: false  # Enable when Apple Developer setup is ready
    env:
      API_ORIGIN: ${{ vars.API_ORIGIN || 'http://localhost:8080' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze and test
        run: |
          dart format --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Build iOS unsigned
        run: flutter build ios --release --no-codesign --dart-define=API_ORIGIN=${{ env.API_ORIGIN }}
