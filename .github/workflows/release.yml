name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      API_ORIGIN: ${{ vars.API_ORIGIN || 'http://localhost:8080' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android-release:
    needs: validate
    runs-on: ubuntu-latest
    environment: android-release
    env:
      API_ORIGIN: ${{ vars.API_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is missing" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks

      - name: Generate key.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties << 'EOF'
          storeFile=upload-keystore.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build signed release APK
        run: flutter build apk --release -PrequireReleaseSigning=true --dart-define=API_ORIGIN=${{ env.API_ORIGIN }}

      - name: Verify signed APK
        run: scripts/verify_android_apk.sh build/app/outputs/flutter-apk/app-release.apk

      - name: Clean up signing material
        if: always()
        run: |
          rm -f android/upload-keystore.jks android/key.properties

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  web-release:
    needs: validate
    runs-on: ubuntu-latest
    env:
      API_ORIGIN: ${{ vars.API_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Web
        run: flutter build web --dart-define=API_ORIGIN=${{ env.API_ORIGIN }}

      - name: Upload Web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-release-${{ github.ref_name }}
          path: build/web
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [android-release, web-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android-release-apk-${{ github.ref_name }}/app-release.apk
            artifacts/web-release-${{ github.ref_name }}/**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
