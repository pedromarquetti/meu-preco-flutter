name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      API_ORIGIN: ${{ vars.API_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Flutter toolchain
        uses: ./.github/actions/setup-flutter

      - name: Validate required inputs
        run: |
          if [ -z "${API_ORIGIN:-}" ]; then
            echo "API_ORIGIN must be set and non-empty for a release." >&2
            exit 1
          fi

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android-release:
    needs: validate
    runs-on: ubuntu-latest
    environment: android-release
    env:
      API_ORIGIN: ${{ vars.API_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Flutter toolchain
        uses: ./.github/actions/setup-flutter

      - name: Validate required vars
        run: |
          if [ -z "${API_ORIGIN:-}" ]; then
            echo "API_ORIGIN must be set and non-empty for a release." >&2
            exit 1
          fi

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          missing=0
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Required release secret ANDROID_KEYSTORE_BASE64 is missing or empty." >&2
            missing=1
          fi
          if [ -z "${STORE_PASSWORD:-}" ]; then
            echo "Required release secret STORE_PASSWORD is missing or empty." >&2
            missing=1
          fi
          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "Required release secret KEY_PASSWORD is missing or empty." >&2
            missing=1
          fi
          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "Required release secret KEY_ALIAS is missing or empty." >&2
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/meupreco-upload-keystore.jks
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "Decoded release keystore is empty." >&2
            exit 1
          fi

      - name: Generate key.properties
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/meupreco-upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          umask 077
          # Absolute storeFile paths are resolved by android/app/build.gradle.kts.
          {
            printf 'storeFile=%s\n' "$KEYSTORE_PATH"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties

      - name: Build signed release APK
        run: flutter build apk --release -PrequireReleaseSigning=true --dart-define=API_ORIGIN="$API_ORIGIN"

      - name: Verify release APK exists and is not debug signed
        run: |
          apk="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -s "$apk" ]; then
            echo "Release APK was not produced: $apk" >&2
            exit 1
          fi
          scripts/verify_android_apk.sh "$apk"

      - name: Remove signing material
        if: always()
        run: |
          rm -f android/key.properties "${RUNNER_TEMP}/meupreco-upload-keystore.jks"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  web-release:
    needs: validate
    runs-on: ubuntu-latest
    environment: web-release
    env:
      API_ORIGIN: ${{ vars.API_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Flutter toolchain
        uses: ./.github/actions/setup-flutter

      - name: Validate required vars
        run: |
          if [ -z "${API_ORIGIN:-}" ]; then
            echo "API_ORIGIN must be set and non-empty for a release." >&2
            exit 1
          fi

      - name: Build Web
        run: flutter build web --dart-define=API_ORIGIN="$API_ORIGIN"

      - name: Upload Web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-release-${{ github.ref_name }}
          path: build/web
          if-no-files-found: error
          retention-days: 30

  ios-unsigned:
    needs: validate
    runs-on: macos-latest
    env:
      API_ORIGIN: ${{ vars.API_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Flutter toolchain
        uses: ./.github/actions/setup-flutter

      - name: Validate required vars
        run: |
          if [ -z "${API_ORIGIN:-}" ]; then
            echo "API_ORIGIN must be set and non-empty for a release." >&2
            exit 1
          fi

      - name: Build iOS unsigned
        run: flutter build ios --release --no-codesign --dart-define=API_ORIGIN="$API_ORIGIN"

  release:
    needs: [android-release, web-release, ios-unsigned]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android-release-apk-${{ github.ref_name }}/app-release.apk
            artifacts/web-release-${{ github.ref_name }}/**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
