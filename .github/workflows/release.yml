name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      API_ORIGIN: ${{ vars.API_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Flutter toolchain
        uses: ./.github/actions/setup-flutter

      - name: Validate required inputs
        run: |
          if [ -z "${API_ORIGIN:-}" ]; then
            echo "API_ORIGIN must be set and non-empty for a release." >&2
            exit 1
          fi

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android-release:
    needs: validate
    runs-on: ubuntu-latest
    environment: android-release
    env:
      API_ORIGIN: ${{ vars.API_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Flutter toolchain
        uses: ./.github/actions/setup-flutter

      - name: Validate required vars
        run: |
          if [ -z "${API_ORIGIN:-}" ]; then
            echo "API_ORIGIN must be set and non-empty for a release." >&2
            exit 1
          fi

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is missing" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks

      - name: Generate key.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties << 'EOF'
          storeFile=upload-keystore.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build signed release APK
        run: flutter build apk --release -PrequireReleaseSigning=true --dart-define=API_ORIGIN="$API_ORIGIN"

      - name: Verify signed APK
        run: scripts/verify_android_apk.sh build/app/outputs/flutter-apk/app-release.apk

      - name: Clean up signing material
        if: always()
        run: |
          rm -f android/upload-keystore.jks android/key.properties

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  web-release:
    needs: validate
    runs-on: ubuntu-latest
    environment: web-release
    env:
      API_ORIGIN: ${{ vars.API_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Flutter toolchain
        uses: ./.github/actions/setup-flutter

      - name: Validate required vars
        run: |
          if [ -z "${API_ORIGIN:-}" ]; then
            echo "API_ORIGIN must be set and non-empty for a release." >&2
            exit 1
          fi

      - name: Build Web
        run: flutter build web --dart-define=API_ORIGIN="$API_ORIGIN"

      - name: Upload Web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-release-${{ github.ref_name }}
          path: build/web
          if-no-files-found: error
          retention-days: 30

  ios-unsigned:
    needs: validate
    runs-on: macos-latest
    env:
      API_ORIGIN: ${{ vars.API_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Flutter toolchain
        uses: ./.github/actions/setup-flutter

      - name: Validate required vars
        run: |
          if [ -z "${API_ORIGIN:-}" ]; then
            echo "API_ORIGIN must be set and non-empty for a release." >&2
            exit 1
          fi

      - name: Build iOS unsigned
        run: flutter build ios --release --no-codesign --dart-define=API_ORIGIN="$API_ORIGIN"

  release:
    needs: [android-release, web-release, ios-unsigned]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android-release-apk-${{ github.ref_name }}/app-release.apk
            artifacts/web-release-${{ github.ref_name }}/**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
